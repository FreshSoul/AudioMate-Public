name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_golden:
        description: "Run the live golden-task benchmark (needs LLM_API_KEY secret)"
        type: boolean
        default: false
      golden_model:
        description: "Model id for the golden benchmark"
        type: string
        default: "gpt-5.5"

jobs:
  test:
    name: pytest + ruff
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install dev deps
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check src

      - name: Pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  golden-benchmark:
    name: golden tasks (live LLM)
    runs-on: windows-latest
    timeout-minutes: 45
    # Only on manual dispatch with the toggle on. Never blocks push/PR —
    # this job calls a real LLM (costs money, non-deterministic, slow).
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_golden }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run golden tasks (threshold 0.8)
        env:
          AUDIOMATE_API_KEY: ${{ secrets.LLM_API_KEY }}
          AUDIOMATE_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        run: >
          python scripts/run_golden_tasks.py
          --model "${{ inputs.golden_model }}"
          --system-prompt full
          --threshold 0.8
          --report golden_report.json

      - name: Upload golden report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-report-${{ inputs.golden_model }}
          path: golden_report.json

